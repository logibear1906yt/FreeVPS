name: Windows-VPS-Pinggy

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1

    - name: Create Windows User
      run: |
        $Password = ConvertTo-SecureString "VPSPassword2026!" -AsPlainText -Force
        New-LocalUser -Name "vpsuser" -Password $Password -Description "RDP Account"
        Add-LocalGroupMember -Group "Administrators" -Member "vpsuser"

    - name: Start Pinggy Tunnel & Show Link
      run: |
        Write-Host "Initializing connection... Your link will print below shortly."
        $OutFile = "D:\pinggy_out.log"
        $ErrFile = "D:\pinggy_err.log"
        
        # Start SSH with completely separate log redirection paths
        Start-Process ssh -ArgumentList "-T -p 443 -R 0:127.0.0.1:3389 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 ${{ secrets.PINGGY_TOKEN }}+tcp@free.pinggy.io" -RedirectStandardOutput $OutFile -RedirectStandardError $ErrFile
        
        # Wait 15 seconds for Pinggy to assign your server link
        Start-Sleep -Seconds 15
        
        Write-Host "========================================="
        if (Test-Path $OutFile) {
            $Content = Get-Content $OutFile -Raw
            Write-Host "OUTPUT LOG:"
            Write-Host $Content
        }
        if (Test-Path $ErrFile) {
            $Errors = Get-Content $ErrFile -Raw
            Write-Host "SYSTEM MESSAGES / WARNINGS:"
            Write-Host $Errors
        }
        Write-Host "========================================="
        
        # Keep the runner holding online for the 6 hour VPS timer
        Start-Sleep -Seconds 21600
