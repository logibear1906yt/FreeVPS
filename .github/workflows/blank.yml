name: Windows-VPS-Pinggy

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1

    - name: Create Windows User
      run: |
        $Password = ConvertTo-SecureString "VPSPassword2026!" -AsPlainText -Force
        New-LocalUser -Name "vpsuser" -Password $Password -Description "RDP Account"
        Add-LocalGroupMember -Group "Administrators" -Member "vpsuser"

    - name: Start Pinggy Tunnel & Show Link
      run: |
        Write-Host "Initializing connection... Querying Local Pinggy Link API..."
        
        # Start SSH with local web info terminal port enabled
        Start-Process ssh -ArgumentList "-T -p 443 -R 0:127.0.0.1:3389 -L 4321:127.0.0.1:4321 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 ${{ secrets.PINGGY_TOKEN }}+tcp@free.pinggy.io"
        
        # Give the background daemon 15 seconds to connect to the node grid
        Start-Sleep -Seconds 15
        
        # Query Pinggy's internal diagnostic portal to fetch your live address
        try {
            $PinggyAPI = Invoke-WebRequest -Uri "https://pinggy.io" -UseBasicParsing | ConvertFrom-Json
            $Url = $PinggyAPI.tunnels.public_url
            Write-Host "========================================="
            Write-Host "YOUR VPS LINK IS: $Url"
            Write-Host "========================================="
        } catch {
            Write-Host "========================================="
            Write-Host "Check your Pinggy Dashboard web panel or run history for link metrics."
            Write-Host "========================================="
        }
        
        # Maintain background runner presence
        Start-Sleep -Seconds 21600
