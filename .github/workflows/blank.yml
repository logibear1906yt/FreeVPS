name: Windows-VPS-Pinggy

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1

    - name: Create Windows User
      run: |
        $Password = ConvertTo-SecureString "VPSPassword2026!" -AsPlainText -Force
        New-LocalUser -Name "vpsuser" -Password $Password -Description "RDP Account"
        Add-LocalGroupMember -Group "Administrators" -Member "vpsuser"

    - name: Start Pinggy Tunnel & Show Link
      run: |
        Write-Host "Initializing connection... Your link will print below shortly."
        $LogFile = "D:\pinggy.log"
        
        # Start SSH in background and write its output text to a file
        Start-Process ssh -ArgumentList "-T -p 443 -R 0:127.0.0.1:3389 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 ${{ secrets.PINGGY_TOKEN }}+tcp@free.pinggy.io" -RedirectStandardOutput $LogFile -RedirectStandardError $LogFile
        
        # Wait 15 seconds for the connection to form, then read and print the log
        Start-Sleep -Seconds 15
        if (Test-Path $LogFile) {
            $Content = Get-Content $LogFile -Raw
            Write-Host "========================================="
            Write-Host $Content
            Write-Host "========================================="
        } else {
            Write-Host "Log file not generated yet. Please wait..."
        }
        
        # Keep the main process holding open for the 6 hour VPS timer
        Start-Sleep -Seconds 21600
