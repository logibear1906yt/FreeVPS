name: Windows-VPS

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Install Ngrok via Chocolatey
      run: |
        choco install ngrok -y

    - name: Authenticate Ngrok
      run: |
        ngrok authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1

    - name: Create Windows User
      run: |
        $Password = ConvertTo-SecureString "VPSPassword2026!" -AsPlainText -Force
        New-LocalUser -Name "vpsuser" -Password $Password -Description "RDP Account"
        Add-LocalGroupMember -Group "Administrators" -Member "vpsuser"

    - name: Create Tunnel
      run: |
        Start-Process ngrok -ArgumentList "tcp 3389"

    - name: Print Connection Link & Keep Alive
      run: |
        Start-Sleep -Seconds 30
        try {
            $NgrokLog = Invoke-WebRequest -Uri "http://127.0.0" -UseBasicParsing | ConvertFrom-Json
            $Url = $NgrokLog.tunnels.public_url
            Write-Host "========================================="
            Write-Host "YOUR VPS LINK IS: $Url"
            Write-Host "========================================="
        } catch {
            Write-Host "========================================="
            Write-Host "Please check your Ngrok Endpoints Dashboard to find the link."
            Write-Host "========================================="
        }
        Start-Sleep -Seconds 21600
