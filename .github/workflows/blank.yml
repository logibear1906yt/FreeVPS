name: Windows-VPS-Pinggy

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1

    - name: Create Windows User
      run: |
        $Password = ConvertTo-SecureString "VPSPassword2026!" -AsPlainText -Force
        New-LocalUser -Name "vpsuser" -Password $Password -Description "RDP Account"
        Add-LocalGroupMember -Group "Administrators" -Member "vpsuser"

    - name: Start Pinggy Tunnel & Print Address
      run: |
        Write-Host "Initializing connection with Pinggy nodes..."
        $OutPath = "D:\pinggy_out.log"
        $ErrPath = "D:\pinggy_err.log"
        
        # Launch SSH tunnel with completely distinct output and error log filenames
        Start-Process cmd -ArgumentList "/c ssh -T -p 443 -R 0:127.0.0.1:3389 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 ${{ secrets.PINGGY_TOKEN }}+tcp@free.pinggy.io" -RedirectStandardOutput $OutPath -RedirectStandardError $ErrPath
        
        # Allow the tunnel handshake 20 seconds to establish with free.pinggy.io servers
        Start-Sleep -Seconds 20
        
        Write-Host "========================================="
        if (Test-Path $OutPath) {
            $RawText = Get-Content $OutPath -Raw
            # Filter the dump file specifically looking for the raw pinggy link format match
            if ($RawText -match "(a\.free\.pinggy\.link:\d+)") {
                Write-Host "YOUR VPS LINK IS: tcp://$($Matches[1])"
            } else {
                Write-Host "Parsing output logs..."
                Get-Content $OutPath
            }
        }
        if (Test-Path $ErrPath) {
            Write-Host "System Messages / Status logs:"
            Get-Content $ErrPath
        }
        Write-Host "========================================="
        
        # Maintain background runner presence for 6 hours
        Start-Sleep -Seconds 21600
